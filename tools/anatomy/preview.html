<!doctype html>
<!--
  Checks public/anatomy/body.glb with plain three.js. Serve the repo root and open
  http://localhost:5182/tools/anatomy/preview.html (cd ../.. && python3 -m http.server 5182).
  Params: view=front|back|left|right|top|bottom|fl|fr, layers=shell,muscles,deep (default all),
  skin=glass|solid, only=id,id (show just these), zoom=2, target=x_y_z (m) or a part id, axes.
  The page title becomes "done" (or "error: …") once rendered, for automated screenshots;
  window.__pick(x, y) and window.__project(id) help check picking from a script.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loading</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a1017; overflow: hidden; font: 11px/1.4 monospace; color: #9da9b5 }
      canvas { display: block }
      #info { position: fixed; left: 8px; top: 6px; pointer-events: none; white-space: pre }
    </style>
    <script type="importmap">
      { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="info"></div>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'

      // Atlas tissue palette (src/anatomy/DESIGN.md §3); anything not listed falls back to its system.
      const BY_ID = {
        brain: '#C9A2A5', heart: '#A9323A', aorta: '#B23B40', 'lung-left': '#C98E8B', 'lung-right': '#C98E8B',
        trachea: '#B8C3C8', esophagus: '#B97870', thyroid: '#9C3E4E', liver: '#6D2923', gallbladder: '#4D6B46',
        stomach: '#C28E78', spleen: '#5D2D40', pancreas: '#CDA87A', 'kidney-left': '#7E342F', 'kidney-right': '#7E342F',
        'small-intestine': '#C9928A', 'large-intestine': '#A97965', 'urinary-bladder': '#C8AF7A',
      }
      const BY_SYSTEM = { muscle: '#9C4A44', bone: '#D8D0C0', organ: '#C98E8B', skin: '#BFDDF5' }

      const q = new URLSearchParams(location.search)
      const view = q.get('view') ?? 'front'
      const layers = new Set((q.get('layers') ?? 'shell,muscles,deep').split(','))
      const only = q.get('only') ? new Set(q.get('only').split(',')) : null
      const zoom = +(q.get('zoom') ?? 1)
      const info = document.getElementById('info')
      window.addEventListener('error', (e) => (document.title = 'error: ' + e.message))

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
      renderer.setPixelRatio(devicePixelRatio)
      renderer.setSize(innerWidth, innerHeight)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      document.body.appendChild(renderer.domElement)
      const scene = new THREE.Scene()
      scene.add(new THREE.HemisphereLight(0xdfe9f3, 0x141a21, 1.6))
      const key = new THREE.DirectionalLight(0xffffff, 2.2)
      key.position.set(-1, 2, 3)
      scene.add(key)
      const rim = new THREE.DirectionalLight(0x9cc8ff, 1.2)
      rim.position.set(1, 1, -3)
      scene.add(rim)

      const glass = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: { color: { value: new THREE.Color('#BFDDF5') } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform vec3 color; varying vec3 vN; varying vec3 vV;
          void main() { float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.4); gl_FragColor = vec4(color, 0.025 + f * 0.55); }`,
      })

      const t0 = performance.now()
      const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('../../public/anatomy/body.glb')
      const loadMs = Math.round(performance.now() - t0)
      const catalog = (await (await fetch('../../src/anatomy/data/catalog.json')).json()).parts
      const root = gltf.scene
      const nodes = root.children.filter((o) => o.isMesh)
      const names = nodes.map((o) => o.name)
      const missing = catalog.map((p) => p.id).filter((id) => !names.includes(id))
      const badExtras = nodes.filter((o) => {
        const p = catalog.find((c) => c.id === o.name)
        const e = o.userData
        return !p || e.system !== p.system || e.layer !== p.layer || e.side !== p.side || e.explode !== p.explode || e.group !== p.group
      })

      let triangles = 0
      for (const mesh of nodes) {
        const { system, layer } = mesh.userData
        mesh.visible = layers.has(layer) && (!only || only.has(mesh.name))
        if (mesh.name === 'skin') {
          mesh.material = q.get('skin') === 'solid' ? new THREE.MeshStandardMaterial({ color: '#BFDDF5', roughness: 0.6 }) : glass
          mesh.renderOrder = 10
        } else {
          mesh.material = new THREE.MeshStandardMaterial({ color: BY_ID[mesh.name] ?? BY_SYSTEM[system], roughness: 0.6, metalness: 0 })
        }
        if (mesh.visible) triangles += mesh.geometry.index.count / 3
      }
      scene.add(root)
      root.updateMatrixWorld(true)
      if (q.has('axes')) scene.add(new THREE.AxesHelper(0.5))

      const box = new THREE.Box3()
      for (const mesh of nodes) if (mesh.visible) box.expandByObject(mesh)
      const size = box.getSize(new THREE.Vector3())
      let target = box.getCenter(new THREE.Vector3())
      const t = q.get('target')
      if (t && /^[-\d.]+_[-\d.]+_[-\d.]+$/.test(t)) target = new THREE.Vector3(...t.split('_').map(Number))
      else if (t) target = new THREE.Box3().setFromObject(root.getObjectByName(t)).getCenter(new THREE.Vector3())

      const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 50)
      const fit = Math.max(size.y, size.x / camera.aspect, size.z / camera.aspect) / 2 / Math.tan((15 * Math.PI) / 180)
      const dirs = { front: [0, 0, 1], back: [0, 0, -1], left: [1, 0, 0], right: [-1, 0, 0], top: [0, 1, 0.001], bottom: [0, -1, 0.001], fl: [0.7, 0.15, 0.7], fr: [-0.7, 0.15, 0.7] }
      camera.position.copy(target).addScaledVector(new THREE.Vector3(...dirs[view]).normalize(), (fit * 1.12) / zoom + size.z / 2)
      camera.lookAt(target)
      renderer.render(scene, camera)

      const summary = { nodes: names.length, missing, badExtras: badExtras.map((o) => o.name), triangles, loadMs, box: { min: box.min.toArray().map((v) => +v.toFixed(3)), max: box.max.toArray().map((v) => +v.toFixed(3)) } }
      console.log('nodes ' + names.join(' '))
      console.log('summary ' + JSON.stringify(summary))
      info.textContent = `${view} · ${names.length} nodes · ${triangles} tris shown · missing ${missing.length}`
      // __pick(x, y): the first visible part (not the skin) under a CSS pixel, like a tap in the viewer.
      const raycaster = new THREE.Raycaster()
      window.__pick = (x, y) => {
        raycaster.setFromCamera(new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), camera)
        const hit = raycaster.intersectObjects(nodes.filter((o) => o.visible && o.name !== 'skin'), false)[0]
        return hit ? hit.object.name : null
      }
      // __project(id): a part's bounding-box centre in CSS pixels.
      window.__project = (id) => {
        const c = new THREE.Box3().setFromObject(root.getObjectByName(id)).getCenter(new THREE.Vector3()).project(camera)
        return [((c.x + 1) / 2) * innerWidth, ((1 - c.y) / 2) * innerHeight]
      }
      window.__preview = summary
      document.title = 'done'
    </script>
  </body>
</html>
