name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the /pomysly/ snapshot (ideas.json) whenever an idea or its comments change.
  issues:
  issue_comment:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

# Only the newest push gets deployed.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Doco (doco/) is plain static files, so nothing to build. Its package.json only tells Node (the tests in
      # tools/) that these scripts are classic ones, so it stays off the site.
      - run: |
          mkdir _site
          cp -r doco/. _site/
          rm _site/package.json
          echo "${{ github.sha }}" > _site/version.txt
          cp -r pomysly _site/pomysly

      # src/ is one Vite project with two apps (src/main.tsx): the interactive body map at /cialo/
      # and, with VITE_APP=gdzie-boli, the "Gdzie boli?" symptom checker at /gdzie-boli/.
      # Relative base, so every asset path is relative (tools/sprawdz.py rejects absolute ones).
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build -- --outDir _site/cialo --emptyOutDir
        env:
          BASE_PATH: ./
          VITE_COMMIT_SHA: ${{ github.sha }}
          # Supabase project for saving pain reports (supabase/README.md). The publishable key is
          # public by design: it ships in the page's JS anyway, and RLS protects the data. Not a secret.
          VITE_SUPABASE_URL: https://yoxnmbflqrppspjdmrks.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xWLqoKLLjgaGuWd_WcbZKg_HUq87CU1
      - run: npm run build -- --outDir _site/gdzie-boli --emptyOutDir
        env:
          BASE_PATH: ./
          VITE_APP: gdzie-boli
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      # Fallback for the ideas page when the visitor's IP hits GitHub's unauthenticated API limit.
      # Not fatal: a failed snapshot shouldn't block deploying the app.
      - run: |
          gh api "repos/${{ github.repository }}/issues?labels=pomys%C5%82&state=all&per_page=100" > ideas.json \
            && mv ideas.json _site/pomysly/ideas.json \
            || echo "::warning::Could not snapshot ideas"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
